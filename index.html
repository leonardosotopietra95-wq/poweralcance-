<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power Alcance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: marca Power Alcance (preto + azul), tema escuro único. Início = só cabeçalho + imagem de palco; cursos e páginas de venda por # */
:root{
  color-scheme:dark;
  --bg:#050709; --surface:#0d1218; --surface-2:#131a23; --ink:#eef3f8; --muted:#94a1b2; --line:#1f2833;
  --blue:#45a3f0; --blue-ink:#03121f; --blue-soft:rgba(69,163,240,.12); --ok:#3fbf86;
  --display:"Saira", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --headh:72px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.label{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:600}
.wrap{max-width:900px;margin-inline:auto;padding-inline:16px}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,7,9,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin-inline:auto;padding-inline:16px;height:var(--headh);display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:block;line-height:0}
.logo img{height:48px;width:auto}
nav.menu{display:flex;align-items:center;gap:4px}
.mlink{background:none;border:0;color:var(--ink);text-decoration:none;font-weight:600;font-size:.95rem;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:6px}
.mlink:hover,.mlink[aria-expanded="true"]{background:var(--surface-2)}
.mlink.on{color:var(--blue)}
.mlink svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;transition:transform .15s}
.mlink[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd{position:relative}
.ddpanel{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:4px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.ddgroup{padding:8px 10px 2px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dditem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;font-size:.95rem}
a.dditem:hover{background:var(--surface-2);color:var(--blue)}
.dditem.soon{color:var(--muted)}
.dditem small{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.ddall{margin-top:4px;border-top:1px solid var(--line);padding:10px;text-decoration:none;color:var(--blue);font-weight:600;font-size:.9rem}

/* Início: só a imagem */
.stage{position:relative;height:calc(100svh - var(--headh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px;overflow:hidden;background:var(--bg)}
.stage img{position:absolute;inset:0;width:100%;height:100%;max-width:100%;object-fit:cover;object-position:50% 50%}
.mcta{display:none}
@media (max-aspect-ratio:1/1){
  .stage{height:125vw;min-height:0}
  .mcta{display:flex;justify-content:center;padding:28px 16px}
  .mcta .btn{width:auto;text-decoration:none;padding:14px 28px}
}

/* Cursos */
.page{padding-block:40px 64px;display:grid;gap:32px}
.intro{display:grid;gap:10px;max-width:620px}
.intro h1{font-size:clamp(2rem,5vw,2.8rem)}
.intro p{color:var(--muted);font-size:1.05rem}
.group{display:grid;gap:14px}
.group h2{font-size:1.3rem;display:flex;align-items:center;gap:12px}
.group h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;text-decoration:none;min-width:0;align-content:start}
a.card:hover{border-color:var(--blue)}
.card h3{font-size:1.2rem}
.card p{color:var(--muted);font-size:.95rem}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);padding-top:4px}
.card .price{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.card.soon{background:transparent;border-style:dashed}
.pill{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue);justify-self:start}
.card.soon .pill{background:var(--surface-2);color:var(--muted)}

/* Página do curso */
.back{display:inline-block;padding-top:24px;font-size:.9rem;color:var(--muted);text-decoration:none}
.back:hover{color:var(--blue)}
.hero{padding-block:14px 28px;display:grid;gap:14px}
.hero h1{font-size:clamp(2.1rem,6vw,3.2rem)}
.hero p.lead{color:var(--muted);font-size:1.08rem;max-width:640px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;background:radial-gradient(ellipse at 50% 30%,#123552,#050709 70%);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;overflow:hidden}
.video .play{width:72px;height:72px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:0;box-shadow:0 0 0 10px rgba(69,163,240,.15)}
.video .play svg{fill:var(--blue-ink);margin-left:4px}
.video .cap{position:absolute;left:16px;bottom:14px;right:16px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr 300px;gap:28px;padding-block:20px 56px;align-items:start}
@media (max-width:780px){.layout{grid-template-columns:1fr}}
.main{display:grid;gap:30px;min-width:0}
.main section{display:grid;gap:12px}
.main h2{font-size:1.4rem}
.main p,.main li{color:var(--muted)}
.lessons{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lessons li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.lessons li:first-child{border-top:0}
.lessons .n{font-family:var(--display);color:var(--blue);font-weight:700;font-size:1.15rem;width:1.4em}
.lessons .t{min-width:0}
.lessons .t strong{display:block;font-weight:600;color:var(--ink)}
.lessons .t span{font-size:.88rem}
.lessons .d{font-size:.85rem;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.lessons svg{fill:none;stroke:currentColor;stroke-width:2}
.about{display:flex;gap:16px;align-items:center}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.5rem}
.buy{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--headh) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px}
.buy .amount{font-family:var(--display);font-weight:700;font-size:2.3rem;font-variant-numeric:tabular-nums;line-height:1}
.buy .amount small{font-family:var(--body);font-weight:400;font-size:.9rem;color:var(--muted)}
.buy ul{margin:0;padding-left:1.1em;color:var(--muted);font-size:.93rem;display:grid;gap:4px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--blue);color:var(--blue-ink);font-size:1rem;width:100%}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.payicons{display:flex;gap:6px;flex-wrap:wrap}
.payicons span{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.share{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.share input{flex:1 1 200px;min-width:0;font:inherit;font-size:.85rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.share .btn{width:auto;padding:10px 16px;font-size:.9rem}

/* Checkout */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px;z-index:30}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:grid;gap:16px}
.sheet header{display:flex;justify-content:space-between;align-items:start;gap:12px}
.x{border:0;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font-weight:600}
.tab[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue)}
.field{display:grid;gap:4px}
.field label{font-size:.85rem;font-weight:600}
.field input,.field select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qr{width:160px;height:160px;justify-self:center;background:#fff;border-radius:10px;display:block}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);text-align:center}
.success{text-align:center;display:grid;gap:10px;justify-items:center}
.success .ic{width:56px;height:56px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center;font-size:1.6rem;font-weight:700}
footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:24px 36px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:520px){.logo img{height:38px}.mlink{padding:9px 10px}}
@media (prefers-reduced-motion:no-preference){.card,.btn,.mlink{transition:border-color .15s,filter .15s,background .15s}}

function cardHTML(c){
  if(c.status!=="open")return`<div class="card soon"><span class="pill">Em breve</span><h3>${c.title}</h3><p>${c.short}</p></div>`;
  return`<a class="card" href="#${c.slug}"><span class="pill">4 aulas</span><h3>${c.title}</h3><p>${c.short}</p><div class="meta"><span>4 × 20 min</span><span class="price">${brl(c.price)}</span></div></a>`;
}
function renderCatalog(){
  document.title="Cursos · Power Alcance";foot.hidden=false;
  app.innerHTML=`<div class="wrap page"><section class="intro"><span class="label">Cursos online</span><h1>Escolha o seu próximo passo</h1>
    <p>Cursos curtos e diretos, com quatro aulas de cerca de 20 minutos. Assista no celular, no seu tempo.</p></section>
    ${GROUPS.map(g=>`<section class="group"><h2>${g.name}</h2><div class="cards">${COURSES.filter(c=>c.group===g.id).map(cardHTML).join("")}</div></section>`).join("")}</div>`;
}

    <div class="cap"><span>Apresentação do curso · grátis</span><span>${c.intro}</span></div></div></section>
  <div class="layout"><div class="main">
    <section><h2>O que você vai assistir</h2><ul class="lessons">${c.lessons.map((l,i)=>`<li><span class="n">${i+1}</span><span class="t"><strong>${l.t}</strong><span>${l.s}</span></span>
      <span class="d"><svg width="14" height="14" viewBox="0 0 24 24" aria-label="Bloqueado"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>${l.d}</span></li>`).join("")}</ul></section>
    <section><h2>Para quem é</h2><ul style="margin:0;padding-left:1.2em;display:grid;gap:4px">${c.forWho.map(x=>`<li>${x}</li>`).join("")}</ul></section>
    <section><h2>Quem ensina</h2><div class="about"><div class="avatar">C</div><p>Pastor Cali está à frente de uma igreja local e acompanha de perto a caminhada dos membros. Os cursos nascem das necessidades que ele vê no dia a dia do ministério.</p></div></section>
    <section><span class="label">Link do curso para divulgar</span><div class="share"><input id="share-link" readonly value="${link}" aria-label="Link do curso"><button class="btn ghost" id="copy">Copiar link</button></div></section>
  </div>
  <aside class="buy"><span class="label">Acesso completo</span><div class="amount">${brl(c.price)} <small>pagamento único</small></div>
    <ul><li>4 aulas em vídeo (cerca de 80 min)</li><li>Assista quando e quantas vezes quiser</li><li>Acesso pelo celular ou computador</li></ul>
    <button class="btn" id="buy">Quero fazer o curso</button><div class="payicons"><span>Pix</span><span>Cartão de crédito</span><span>Até 3× sem juros</span></div></aside>
  </div></div>`;
  document.getElementById("buy").onclick=()=>openCheckout(c);
  document.getElementById("copy").onclick=async e=>{const inp=document.getElementById("share-link");
    try{await navigator.clipboard.writeText(inp.value);e.target.textContent="Link copiado";}catch{inp.select();e.target.textContent="Selecionado, use Ctrl+C";}};
}

/* Checkout de demonstração */
const ov=document.getElementById("checkout"),sheet=document.getElementById("sheet");let method="pix";
const closeCk=()=>{ov.hidden=true;};
ov.addEventListener("click",e=>{if(e.target===ov)closeCk();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCk();setDD(false);}});
function openCheckout(c){ov.hidden=false;method="pix";drawCk(c);}
function drawCk(c){
  const body=method==="pix"?`<canvas class="qr" id="qr" width="160" height="160" aria-label="QR Code Pix de exemplo"></canvas>
    <div class="code">00020126580014BR.GOV.BCB.PIX0136exemplo-chave-pix5204000053039865405${c.price.toFixed(2)}5802BR</div><button class="btn" id="pay">Já paguei</button>`
  :`<div class="field"><label for="cc-num">Número do cartão</label><input id="cc-num" inputmode="numeric" placeholder="0000 0000 0000 0000" autocomplete="off"></div>
    <div class="row2"><div class="field"><label for="cc-exp">Validade</label><input id="cc-exp" placeholder="MM/AA" autocomplete="off"></div><div class="field"><label for="cc-cvv">CVV</label><input id="cc-cvv" inputmode="numeric" placeholder="123" autocomplete="off"></div></div>
    <div class="field"><label for="cc-inst">Parcelas</label><select id="cc-inst"><option>1× de ${brl(c.price)}</option><option>2× de ${brl(c.price/2)}</option><option>3× de ${brl(c.price/3)}</option></select></div>
    <button class="btn" id="pay">Pagar ${brl(c.price)}</button>`;
  sheet.innerHTML=`<header><div><span class="label">Pagamento</span><h2 id="ck-title" style="font-size:1.35rem">${c.title}</h2></div><button class="x" aria-label="Fechar" id="ck-x">×</button></header>
    <div class="field"><label for="ck-name">Nome</label><input id="ck-name" placeholder="Seu nome completo" autocomplete="off"></div>
    <div class="field"><label for="ck-mail">E-mail para receber o acesso</label><input id="ck-mail" type="email" placeholder="voce@email.com" autocomplete="off"></div>
    <div class="tabs" role="group" aria-label="Forma de pagamento"><button class="tab" data-m="pix" aria-pressed="${method==="pix"}">Pix</button><button class="tab" data-m="card" aria-pressed="${method==="card"}">Cartão</button></div>
    ${body}<p class="note">Versão de demonstração: nenhum pagamento é cobrado.</p>`;
  document.getElementById("ck-x").onclick=closeCk;
  sheet.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{method=b.dataset.m;drawCk(c);});
  document.getElementById("pay").onclick=()=>{sheet.innerHTML=`<div class="success"><div class="ic">✓</div><h2 style="font-size:1.4rem">Pagamento confirmado</h2>
    <p style="color:var(--muted)">O acesso às 4 aulas de “${c.title}” foi enviado para o seu e-mail.</p><button class="btn" id="ok">Começar a assistir</button><p class="note">Versão de demonstração.</p></div>`;
    document.getElementById("ok").onclick=closeCk;};
  if(method==="pix"){const cv=document.getElementById("qr"),x=cv.getContext("2d"),n=25,s=6,o=5;x.fillStyle="#050709";
    let sd=7;const r=()=>(sd=(sd*9301+49297)%233280)/233280;
    const f=(a,b)=>{x.fillRect(o+a*s,o+b*s,7*s,7*s);x.clearRect(o+(a+1)*s,o+(b+1)*s,5*s,5*s);x.fillRect(o+(a+2)*s,o+(b+2)*s,3*s,3*s);};
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(!((i<8&&j<8)||(i>16&&j<8)||(i<8&&j>16))&&r()>.5)x.fillRect(o+i*s,o+j*s,s,s);}f(0,0);f(18,0);f(0,18);}
}

function route(hh){
  const h=(hh!=null?hh:location.hash.slice(1)),c=COURSES.find(x=>x.slug===h&&x.status==="open");
  closeCk();setDD(false);
  document.getElementById("m-inicio").classList.toggle("on",!c&&h!=="cursos");
  mBtn.classList.toggle("on",!!c||h==="cursos");
  if(c)renderCourse(c);else if(h==="cursos")renderCatalog();else renderHome();
  window.scrollTo(0,0);
}
/* Navegação feita pelo próprio script: funciona mesmo abrindo o arquivo no celular */
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]');if(!a)return;
  e.preventDefault();const h=a.getAttribute("href").slice(1);
  try{history.pushState(null,"","#"+h);}catch(_){}
  route(h);
});
window.addEventListener("popstate",()=>route());
window.addEventListener("hashchange",()=>route());
route();
</script>
</body></html>
